name: PewPew Manual Build Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Test package to build
        required: true
        default: mac-arm64
        type: choice
        options:
          - mac-x64
          - mac-arm64
          - windows-x64

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  mac-x64:
    name: macOS x64 test package
    if: inputs.platform == 'mac-x64'
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Prebuild x64 sidecars
        run: pnpm run prebuild --force x86_64-apple-darwin

      - name: Web build
        run: pnpm web:build

      - name: Tauri build
        run: pnpm exec tauri build --target x86_64-apple-darwin

      - name: Check package architecture
        run: node scripts/check-macos-arch.mjs x64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: pewpew-mac-x64-dmg
          path: target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  mac-arm64:
    name: macOS arm64 test package
    if: inputs.platform == 'mac-arm64'
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Prebuild arm64 sidecars
        run: pnpm run prebuild --force aarch64-apple-darwin

      - name: Web build
        run: pnpm web:build

      - name: Tauri build
        run: pnpm exec tauri build --target aarch64-apple-darwin

      - name: Check package architecture
        run: node scripts/check-macos-arch.mjs arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: pewpew-mac-arm64-dmg
          path: target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows x64 test package
    if: inputs.platform == 'windows-x64'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prebuild Windows x64 sidecars
        run: pnpm run prebuild --force x86_64-pc-windows-msvc

      - name: Web build
        run: pnpm web:build

      - name: Tauri build
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pewpew-windows-x64-installer
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/nsis/*.msi
          if-no-files-found: error
