name: PewPew Manual Build Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Test package to build
        required: true
        default: mac-arm64
        type: choice
        options:
          - mac-x64
          - mac-arm64
          - windows-x64

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  mac-x64:
    name: macOS x64 test package
    if: inputs.platform == 'mac-x64'
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Prebuild x64 sidecars
        run: pnpm run prebuild --force x86_64-apple-darwin

      - name: Web build
        run: pnpm web:build

      - name: Cargo check
        run: cargo check --target x86_64-apple-darwin

      - name: Tauri build
        run: pnpm exec tauri build --target x86_64-apple-darwin

      - name: Check package architecture
        run: node scripts/check-macos-arch.mjs x64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PewPewCloud-mac-x64
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app/**
          if-no-files-found: error

  mac-arm64:
    name: macOS arm64 test package
    if: inputs.platform == 'mac-arm64'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Prebuild arm64 sidecars
        run: pnpm run prebuild --force aarch64-apple-darwin

      - name: Web build
        run: pnpm web:build

      - name: Cargo check
        run: cargo check --target aarch64-apple-darwin

      - name: Tauri build
        run: pnpm exec tauri build --target aarch64-apple-darwin

      - name: Check package architecture
        run: node scripts/check-macos-arch.mjs arm64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PewPewCloud-mac-arm64
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app/**
          if-no-files-found: error

  windows-x64:
    name: Windows x64 test package
    if: inputs.platform == 'windows-x64'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prebuild Windows x64 sidecars
        run: pnpm run prebuild --force x86_64-pc-windows-msvc

      - name: Web build
        run: pnpm web:build

      - name: Cargo check
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Tauri build
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc

      - name: Check Windows installers
        shell: pwsh
        run: |
          $installers = @()
          $installers += Get-ChildItem -Path "target" -Recurse -File -Include "*.exe","*.msi" | Where-Object {
            $_.FullName -match "\\bundle\\(nsis|msi)\\"
          }
          if ($installers.Count -eq 0) {
            Write-Error "No Windows installer was generated."
            exit 1
          }
          $installers | ForEach-Object { Write-Host "Found installer: $($_.FullName)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PewPewCloud-windows-x64
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/nsis/*.msi
            target/**/release/bundle/msi/*.msi
          if-no-files-found: error
