name: 问题反馈 / Bug report
description: 报告 PewPew 云客户端的问题 / Report a PewPew client issue
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [版本说明](https://github.com/xinlexu/pewpew-client/releases) 和 [已有问题](https://github.com/xinlexu/pewpew-client/issues)。
        当前为内测版本；无需安装上游 AutoBuild 来提交 PewPew 的问题。
        This is a public report. Omit subscription URLs, credentials and personal data.
  - type: input
    id: version
    attributes:
      label: PewPew 版本 / Version
      placeholder: 0.1.4 / v0.1.4-windows-test.20261007
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: 系统与架构 / OS and architecture
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 说明操作顺序、连接模式，以及是否涉及安装、升级或退出 / Include connection mode and installation, upgrade or exit context
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 相关错误与诊断 / Relevant errors and diagnostics
      description: 可选；只粘贴已去除订阅、凭据和个人信息的相关片段 / Optional redacted excerpts only
      render: text
    validations:
      required: false
