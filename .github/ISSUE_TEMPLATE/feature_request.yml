name: 功能建议 / Feature request
description: 提出 PewPew 云客户端的功能建议 / Suggest a PewPew feature
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [现有功能](https://github.com/xinlexu/pewpew-client#readme) 和 [已有建议](https://github.com/xinlexu/pewpew-client/issues)。
        Describe the user problem and desired outcome. No upstream AutoBuild installation is required.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Proposed behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 相关平台 / Relevant platform
    validations:
      required: false
